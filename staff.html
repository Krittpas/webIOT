<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data:; connect-src 'none'; object-src 'none'; base-uri 'self'; form-action 'none'; frame-ancestors 'none'; upgrade-insecure-requests">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#0E1320">

<title>พี่สตาฟทั้งหมด</title>
<meta name="description" content="รายชื่อและ IG ของพี่สตาฟทั้ง 40 คน">

<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 40'%3E%3Ccircle cx='22' cy='20' r='14' fill='none' stroke='%23FF7A59' stroke-width='6'/%3E%3Ccircle cx='42' cy='20' r='14' fill='none' stroke='%2358D6C2' stroke-width='6'/%3E%3C/svg%3E">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bai+Jamjuree:wght@500;600;700&family=IBM+Plex+Sans+Thai:wght@400;500&display=swap" rel="stylesheet">

<style>
  :root{
    --ink-950:#0E1320;
    --ink-900:#141B2B;
    --glass: rgba(30,39,64,.55);
    --hairline: rgba(255,255,255,.08);
    --paper:#F5F1E8;
    --muted:#9AA3BD;
    --coral-soft: rgba(255,122,89,.22);
    --teal-soft: rgba(88,214,194,.20);
    --ease: cubic-bezier(.22,1,.36,1);
  }

  *, *::before, *::after{ box-sizing:border-box; }
  html, body{ margin:0; padding:0; }

  body{
    min-height:100vh;
    background:
      radial-gradient(circle at 20% -10%, var(--ink-900), transparent 60%),
      radial-gradient(circle at 100% 110%, #18233a, transparent 55%),
      var(--ink-950);
    font-family:'IBM Plex Sans Thai', system-ui, sans-serif;
    color:var(--paper);
    padding-bottom:60px;
    overflow-x:hidden;
  }

  .aurora{
    position:fixed; inset:0; pointer-events:none; z-index:0;
    background:
      radial-gradient(420px 280px at 15% 18%, var(--coral-soft), transparent 70%),
      radial-gradient(460px 320px at 85% 82%, var(--teal-soft), transparent 70%);
    filter:blur(10px);
    opacity:.65;
  }

  .page{
    position:relative; z-index:1;
    max-width:780px;
    margin:0 auto;
    padding:28px 20px 0;
  }

  /* ── Header ── */
  .page-head{
    display:flex; align-items:center; gap:14px; margin-bottom:32px;
  }

  .back-btn{
    display:inline-flex; align-items:center; gap:6px;
    font-family:'Bai Jamjuree', sans-serif; font-weight:600; font-size:.88rem;
    color:var(--muted); text-decoration:none;
    padding:8px 14px; border-radius:12px;
    border:1px solid var(--hairline);
    background:rgba(30,39,64,.5);
    transition:color .2s var(--ease), border-color .2s var(--ease), transform .2s var(--ease);
    flex-shrink:0;
  }
  .back-btn:hover{ color:var(--paper); border-color:rgba(255,255,255,.22); transform:translateX(-2px); }
  .back-btn:focus-visible{ outline:2px solid var(--paper); outline-offset:2px; }
  .back-btn svg{ width:16px; height:16px; }

  .page-title{
    font-family:'Bai Jamjuree', sans-serif; font-weight:700;
    font-size:clamp(1.25rem, 4vw, 1.65rem);
    margin:0;
  }

  /* ── Team section ── */
  .team-section{ margin-bottom:38px; }

  .team-name{
    font-family:'Bai Jamjuree', sans-serif; font-weight:700; font-size:1.05rem;
    margin:0 0 5px; letter-spacing:.02em;
  }

  .team-divider{
    height:2px; border-radius:2px; opacity:.4; margin-bottom:16px;
  }

  /* ── Staff grid ── */
  .staff-grid{
    display:grid;
    grid-template-columns:repeat(5, 1fr);
    gap:10px;
  }

  @media (max-width:480px){
    .staff-grid{ grid-template-columns:repeat(2, 1fr); gap:10px; }
  }
  @media (min-width:481px) and (max-width:680px){
    .staff-grid{ grid-template-columns:repeat(4, 1fr); }
  }

  /* ── Staff card ── */
  .staff-card{
    display:flex; flex-direction:column; align-items:center; gap:6px;
    padding:14px 8px 12px;
    border-radius:16px; border:1px solid var(--hairline);
    background:var(--glass);
    backdrop-filter:blur(12px); -webkit-backdrop-filter:blur(12px);
    box-shadow:0 6px 18px -10px rgba(0,0,0,.5);
    text-align:center;
    transition:transform .22s var(--ease), box-shadow .22s var(--ease);
  }
  .staff-card:hover{ transform:translateY(-2px); box-shadow:0 10px 24px -12px rgba(0,0,0,.6); }

  /* ── Photo ── */
  .photo-wrap{
    width:72px; height:72px;
    border-radius:50%;
    border:2.5px solid;
    overflow:hidden;
    display:flex; align-items:center; justify-content:center;
    flex-shrink:0;
  }

  .staff-photo{
    width:100%; height:100%;
    object-fit:cover; display:block;
  }

  .photo-placeholder{
    font-family:'Bai Jamjuree', sans-serif;
    font-weight:700; font-size:1.55rem;
    line-height:1;
  }

  /* ── Text ── */
  .staff-name{
    font-weight:600; font-size:.82rem; line-height:1.3; color:var(--paper);
  }

  .staff-ig{
    font-size:.73rem; color:var(--muted); line-height:1.3; word-break:break-all;
  }

  @media (prefers-reduced-motion:reduce){
    *, *::before, *::after{ animation:none !important; transition:none !important; }
  }
</style>
</head>
<body>
  <div class="aurora" aria-hidden="true"></div>

  <main class="page">
    <header class="page-head">
      <a href="index.html" class="back-btn" aria-label="กลับหน้าหลัก">
        <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
          <path d="M15 18l-6-6 6-6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        กลับ
      </a>
      <h1 class="page-title">พี่สตาฟทั้งหมด</h1>
    </header>

    <div id="teams-container"></div>
  </main>

  <script src="staff.js"></script>
</body>
</html>
