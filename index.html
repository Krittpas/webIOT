<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'none'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data:; connect-src 'none'; object-src 'none'; base-uri 'self'; form-action 'none'; frame-ancestors 'none'; upgrade-insecure-requests">
<meta name="referrer" content="no-referrer">

<title>ลิงก์ของเรา</title>
<meta name="description" content="หน้ารวมลิงก์ — เข้าร่วมกลุ่ม LINE และ Google Classroom">
<meta property="og:title" content="ลิงก์ของเรา">
<meta property="og:description" content="เลือกช่องทางที่ต้องการเข้าร่วม">
<meta property="og:type" content="website">

<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 40'%3E%3Ccircle cx='22' cy='20' r='14' fill='none' stroke='%23FF7A59' stroke-width='6'/%3E%3Ccircle cx='42' cy='20' r='14' fill='none' stroke='%2358D6C2' stroke-width='6'/%3E%3C/svg%3E">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bai+Jamjuree:wght@500;600;700&family=IBM+Plex+Sans+Thai:wght@400;500&display=swap" rel="stylesheet">

<style>
  :root{
    --ink-950:#0E1320;
    --ink-900:#141B2B;
    --glass: rgba(30,39,64,.55);
    --hairline: rgba(255,255,255,.08);
    --paper:#F5F1E8;
    --muted:#9AA3BD;
    --coral:#FF7A59;
    --coral-soft: rgba(255,122,89,.22);
    --teal:#58D6C2;
    --teal-soft: rgba(88,214,194,.20);
    --ease: cubic-bezier(.22,1,.36,1);
  }

  *{ box-sizing:border-box; }
  html,body{ margin:0; padding:0; }

  body{
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    background:
      radial-gradient(circle at 20% -10%, var(--ink-900), transparent 60%),
      radial-gradient(circle at 100% 110%, #18233a, transparent 55%),
      var(--ink-950);
    font-family:'IBM Plex Sans Thai', system-ui, sans-serif;
    color:var(--paper);
    padding:32px 20px 48px;
    overflow-x:hidden;
  }

  .aurora{
    position:fixed; inset:0; pointer-events:none; z-index:0;
    background:
      radial-gradient(420px 280px at 15% 18%, var(--coral-soft), transparent 70%),
      radial-gradient(460px 320px at 85% 82%, var(--teal-soft), transparent 70%);
    filter: blur(10px);
    opacity:.65;
  }

  .hub{ position:relative; z-index:1; width:100%; max-width:440px; text-align:center; }

  .mark{ display:flex; justify-content:center; margin-bottom:18px; }
  .mark svg{ width:64px; height:40px; }
  .ring{ stroke-dasharray:88; stroke-dashoffset:88; animation:draw 1s var(--ease) .15s forwards; }
  .ring + .ring{ animation-delay:.32s; }
  @keyframes draw{ to{ stroke-dashoffset:0; } }

  .title{
    font-family:'Bai Jamjuree', sans-serif; font-weight:700;
    font-size:clamp(1.6rem, 5vw, 2.1rem);
    margin:0 0 6px; letter-spacing:.2px;
    opacity:0; animation:rise .6s var(--ease) .25s forwards;
  }
  .subtitle{
    margin:0 0 28px; color:var(--muted); font-size:.98rem;
    opacity:0; animation:rise .6s var(--ease) .35s forwards;
  }

  .cards{ display:flex; flex-direction:column; gap:14px; }

  .card{
    position:relative; display:grid; grid-template-columns:auto 1fr auto;
    align-items:center; gap:14px; text-align:left; text-decoration:none; color:var(--paper);
    padding:18px 16px; border-radius:20px; border:1px solid var(--hairline);
    background:var(--glass);
    backdrop-filter:blur(14px); -webkit-backdrop-filter:blur(14px);
    box-shadow:0 10px 26px -14px rgba(0,0,0,.6);
    transition:transform .25s var(--ease), box-shadow .25s var(--ease), border-color .25s var(--ease);
    opacity:0; animation:rise .6s var(--ease) forwards;
  }
  .card--chat{ animation-delay:.46s; }
  .card--classroom{ animation-delay:.56s; }

  .card:hover, .card:focus-visible{ transform:translateY(-3px); }
  .card--chat:hover, .card--chat:focus-visible{ border-color:rgba(255,122,89,.45); box-shadow:0 16px 34px -16px var(--coral-soft); }
  .card--classroom:hover, .card--classroom:focus-visible{ border-color:rgba(88,214,194,.45); box-shadow:0 16px 34px -16px var(--teal-soft); }
  .card:focus-visible{ outline:2px solid var(--paper); outline-offset:3px; }

  .card-icon{
    position:relative; width:44px; height:44px; border-radius:50%;
    display:flex; align-items:center; justify-content:center; flex-shrink:0;
  }
  .card--chat .card-icon{ background:var(--coral-soft); color:var(--coral); }
  .card--classroom .card-icon{ background:var(--teal-soft); color:var(--teal); }
  .card-icon svg{ width:22px; height:22px; overflow:visible; }

  .pulse-dot{ fill:var(--coral); }
  .pulse-ring{
    fill:none; stroke:var(--coral); stroke-width:1.4;
    transform-origin:18px 6px; animation:ping 1.8s ease-out infinite;
  }
  @keyframes ping{
    0%{ transform:scale(1); opacity:.9; }
    80%{ transform:scale(2.2); opacity:0; }
    100%{ opacity:0; }
  }

  .card-body{ display:flex; flex-direction:column; gap:2px; min-width:0; }
  .card-eyebrow{ font-family:'Bai Jamjuree', sans-serif; font-size:.72rem; letter-spacing:.06em; }
  .card--chat .card-eyebrow{ color:var(--coral); }
  .card--classroom .card-eyebrow{ color:var(--teal); }
  .card-title{ font-weight:600; font-size:1.02rem; }
  .card-desc{ color:var(--muted); font-size:.86rem; }

  .card-arrow{ color:var(--muted); transition:transform .25s var(--ease), color .25s var(--ease); }
  .card:hover .card-arrow, .card:focus-visible .card-arrow{ transform:translateX(3px); color:var(--paper); }

  .footnote{
    margin:26px 0 0; display:flex; align-items:center; justify-content:center; gap:6px;
    color:var(--muted); font-size:.78rem;
    opacity:0; animation:rise .6s var(--ease) .68s forwards;
  }
  .footnote svg{ width:13px; height:13px; flex-shrink:0; }

  @keyframes rise{ from{ opacity:0; transform:translateY(10px); } to{ opacity:1; transform:translateY(0); } }

  @media (prefers-reduced-motion: reduce){
    .ring, .title, .subtitle, .card, .footnote{ animation:none !important; opacity:1 !important; stroke-dashoffset:0 !important; transform:none !important; }
    .pulse-ring{ animation:none !important; opacity:0 !important; }
  }

  @media (min-width:560px){ .title{ font-size:2.2rem; } }
</style>
</head>
<body>
  <div class="aurora" aria-hidden="true"></div>

  <main class="hub">
    <div class="mark" aria-hidden="true">
      <svg viewBox="0 0 64 40" fill="none" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <linearGradient id="markGrad" x1="0" y1="0" x2="64" y2="40">
            <stop offset="0" stop-color="#FF7A59"/>
            <stop offset="1" stop-color="#58D6C2"/>
          </linearGradient>
        </defs>
        <circle class="ring" cx="22" cy="20" r="14" stroke="url(#markGrad)" stroke-width="5"/>
        <circle class="ring" cx="42" cy="20" r="14" stroke="url(#markGrad)" stroke-width="5"/>
      </svg>
    </div>

    <h1 class="title">ลิงก์ของเรา</h1>
    <p class="subtitle">เลือกช่องทางที่ต้องการเข้าร่วม</p>

    <div class="cards">
      <a class="card card--chat"
         href="https://line.me/R/ti/g/eZsDmCDk-w"
         target="_blank" rel="noopener noreferrer" referrerpolicy="no-referrer">
        <span class="card-icon">
          <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M4 5.5C4 4.67 4.67 4 5.5 4h13C19.33 4 20 4.67 20 5.5v9c0 .83-.67 1.5-1.5 1.5H9.8l-3.3 3v-3H5.5C4.67 16 4 15.33 4 14.5v-9z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/>
            <circle class="pulse-ring" cx="18" cy="6" r="2"/>
            <circle class="pulse-dot" cx="18" cy="6" r="2"/>
          </svg>
        </span>
        <span class="card-body">
          <span class="card-eyebrow">แชทกลุ่ม</span>
          <span class="card-title">เข้าร่วมกลุ่ม LINE</span>
          <span class="card-desc">พูดคุย นัดหมาย ถามตอบได้ทันที</span>
        </span>
        <span class="card-arrow" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M9 6l6 6-6 6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </span>
      </a>

      <a class="card card--classroom"
         href="https://classroom.google.com/c/ODY3ODM5MzM1ODc0?cjc=7dyvziap"
         target="_blank" rel="noopener noreferrer" referrerpolicy="no-referrer">
        <span class="card-icon">
          <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M12 5.6c-1.8-1.1-4.3-1.4-6.4-1.1-.6.08-1 .6-1 1.18v11.1c0 .7.62 1.23 1.32 1.12 1.96-.3 4.2 0 6.08 1.1 1.88-1.1 4.12-1.4 6.08-1.1.7.11 1.32-.42 1.32-1.12V5.67c0-.58-.4-1.1-1-1.18-2.1-.3-4.6 0-6.4 1.1z" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/>
            <path d="M12 5.6v13.2" stroke="currentColor" stroke-width="1.3"/>
          </svg>
        </span>
        <span class="card-body">
          <span class="card-eyebrow">ห้องเรียนออนไลน์</span>
          <span class="card-title">เข้าสู่ Google Classroom</span>
          <span class="card-desc">เนื้อหา การบ้าน และประกาศทั้งหมด</span>
        </span>
        <span class="card-arrow" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M9 6l6 6-6 6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </span>
      </a>
    </div>

    <p class="footnote">
      <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
        <rect x="6" y="10.5" width="12" height="9" rx="2" stroke="currentColor" stroke-width="1.4"/>
        <path d="M8.5 10.5V7.6a3.5 3.5 0 0 1 7 0v2.9" stroke="currentColor" stroke-width="1.4"/>
        <circle cx="12" cy="14.6" r="1" fill="currentColor"/>
      </svg>
      เปิดลิงก์ทางการโดยตรง ไม่มีการเก็บข้อมูลผู้ใช้บนหน้านี้
    </p>
  </main>
</body>
</html>
